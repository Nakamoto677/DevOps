- name: Configure Kubernetes Master Node with Calico via Helm
  hosts: masters
  become: true
  tasks:
    - name: Check if Kubernetes is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init_check

    - name: Initialize Kubernetes cluster
      ansible.builtin.shell: |
        kubeadm init --pod-network-cidr=172.16.0.0/16
      when: not kubeadm_init_check.stat.exists

    - name: Create .kube directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy admin.conf to user config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Install pip
      ansible.builtin.apt:
        name: python3-pip
        state: present
      when: not kubeadm_init_check.stat.exists

    - name: Install kubernetes python package
      ansible.builtin.pip:
        name: kubernetes
        state: present
      when: not kubeadm_init_check.stat.exists

    - name: Install Helm via snap
      community.general.snap:
        name: helm
        classic: true
      when: not kubeadm_init_check.stat.exists

    - name: Add Project Calico Helm repo
      kubernetes.core.helm_repository:
        name: projectcalico
        repo_url: "https://tigera.io"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: not kubeadm_init_check.stat.exists

    - name: Install Calico via Helm
      kubernetes.core.helm:
        name: calico
        chart_ref: projectcalico/tigera-operator
        release_namespace: tigera-operator
        create_namespace: true
        values:
          installation:
            calicoNetwork:
              ipPools:
                - cidr: 172.16.0.0/16
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: not kubeadm_init_check.stat.exists

    - name: Generate join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

